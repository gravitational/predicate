version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard # no allowlist configured; v2 default denies all non-stdlib
    - dupl
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5 # v2 successor of exhaustruct
    - forcetypeassert
    - gomodguard # deprecated; superseded by gomodguard_v2, which stays enabled
    - ireturn
    - lll
    - mnd
    - nilnil
    - nlreturn
    - nonamedreturns
    - paralleltest
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    # New in golangci-lint v2; findings deferred to a follow-up PR to keep
    # the upgrade config-only.
    - embeddedstructfieldcheck
    - funcorder
    - inamedparam
    - intrange
    - modernize
    - noinlineerr
    - perfsprint
    - tagalign
    - testifylint
    - wsl
    - wsl_v5 # v2 successor of wsl
  settings:
    funlen:
      lines: -1
      statements: 50
    goconst:
      min-len: 5
      min-occurrences: 3
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - shadow
      disable:
        - inline # new in v2; findings deferred with the linters above
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - funlen
          - goconst
          - tagliatelle
        path: (.+)_test.go
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: exported (type|method|function) (.+) should have comment or be unexported
      # revive's unused-parameter is newly enabled under v2's default ruleset.
      - linters:
          - revive
        text: unused-parameter
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
